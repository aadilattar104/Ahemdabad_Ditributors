<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel Intelligence</title>
    <!-- Tabler Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        color: #111;
        background: #f9f9f8;
      }
      input, select, textarea {
        font-family: inherit;
        font-size: 13px;
        border-radius: 8px;
        border: 0.5px solid #ccc;
        padding: 8px 12px;
        outline: none;
        background: #fff;
        color: #111;
      }
      input:focus, select:focus { box-shadow: 0 0 0 2px #93c5fd; border-color: #3b82f6; }
      button {
        font-family: inherit;
        font-size: 13px;
        border-radius: 8px;
        border: 0.5px solid #ccc;
        padding: 8px 14px;
        background: #fff;
        color: #111;
        cursor: pointer;
        transition: background 0.12s;
      }
      button:hover { background: #f5f5f5; }
      button:active { transform: scale(0.98); }

      /* ── CSS design tokens ── */
      :root {
        --color-background-primary:   #ffffff;
        --color-background-secondary: #f5f5f3;
        --color-background-tertiary:  #f9f9f8;
        --color-background-info:      #e6f1fb;
        --color-background-success:   #eaf3de;
        --color-background-warning:   #faeeda;
        --color-background-danger:    #fcebeb;

        --color-text-primary:   #111111;
        --color-text-secondary: #555550;
        --color-text-tertiary:  #999990;
        --color-text-info:      #185fa5;
        --color-text-success:   #3b6d11;
        --color-text-warning:   #854f0b;
        --color-text-danger:    #a32d2d;

        --color-border-tertiary: rgba(0,0,0,0.12);
        --color-border-secondary: rgba(0,0,0,0.22);
        --color-border-primary:   rgba(0,0,0,0.35);
        --color-border-info:    #185fa5;
        --color-border-success: #3b6d11;
        --color-border-warning: #854f0b;
        --color-border-danger:  #a32d2d;

        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;

        --font-sans: system-ui, -apple-system, sans-serif;
        --font-mono: 'Courier New', monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
